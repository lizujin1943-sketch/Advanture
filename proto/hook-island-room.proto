syntax = "proto3";
package advanture.hookisland.room.v1;
option csharp_namespace = "Advanture.HookIsland.Network.Protocol";

// 游戏房间协议，独立于帧同步核心。
// 已发布的字段编号不可换含义，删除后必须 reserved。
message RoomPacket {
  uint32 protocol_version = 1; // 房间协议版本 29：预留席位、晚加入及持久身份存档恢复。
  reserved 2 to 9;
  oneof body { // 消息正文，选择一个分支。
    JoinRoom join = 10; // 客户端申请加入房间。
    WelcomeRoom welcome = 11; // 房主接受申请并返回房间信息。
    RoomAck ack = 12; // 客户端确认 welcome，区别于帧同步 Ready。
    RoomReject reject = 13; // 房主拒绝请求并说明原因。
    RestartRound restart_round = 14; // 仅房主发送：切换到下一局，等待全员确认。
    RestartAck restart_ack = 15; // 客户端已清空旧局输入并准备接收新局初态。
  }
}

// 客户端的加入申请。
message JoinRoom {
  uint32 slot = 1; // 申请的玩家位置，0 为房主，65535 请求自动分配 1～3。
  bytes map_hash = 2; // 客户端地图编码的 SHA-256 摘要，32 字节。
  bytes room_id = 3; // 仅恢复时携带的原房间 ID；新加入留空。
  bytes resume_token = 4; // 仅恢复时携带的 32 字节不透明凭据，不记录到日志。
  bytes player_key = 5; // 本机持久席位凭据，32 字节；不进入共享快照或日志。
}

// 房主接受加入后返回的信息。
message WelcomeRoom {
  uint32 slot = 1; // 房主确认的玩家位置，须与申请一致。
  bytes session_id = 2; // 会话标识：16 字节，采用 Guid.ToByteArray 顺序。
  bytes map_hash = 3; // 房主地图编码的 SHA-256 摘要，32 字节。
  uint64 epoch = 4; // 当前局号，晚加入或恢复可以直接进入后续局。
  bytes resume_token = 5; // 首次确认激活后可在当前应用保存的 32 字节凭据。
}

// 确认已验证 welcome 并创建本地会话，无需附加字段。
message RoomAck {}

// 同一房间的新运行；地图与加入时一致，不用于修改规则或重新分配席位。
message RestartRound {
  bytes session_id = 1; // 原房间身份，16 字节 Guid.ToByteArray 顺序。
  uint64 epoch = 2; // 必须是本地当前局号 + 1；重复通知只重新确认。
  bytes map_hash = 3; // 原地图摘要，32 字节。
}

message RestartAck {
  bytes session_id = 1; // 确认的房间身份。
  uint64 epoch = 2; // 确认的新局号，不能代替初次加入的 RoomAck。
}

// 房间请求被拒绝的原因。
enum RejectReason {
  REJECT_UNSPECIFIED = 0; // 未指定，不可作为有效原因。
  INCOMPATIBLE = 1; // 协议版本或地图不一致。
  UNAVAILABLE = 2; // 无可用空位、凭据不符或当前阶段不能接入。
  INVALID_REQUEST = 3; // 请求格式、字段或发送阶段非法。
}

// 房主的拒绝回复。
message RoomReject {
  RejectReason reason = 1; // 拒绝原因，须为有效的非零枚举值。
}
