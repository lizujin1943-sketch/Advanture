<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc">
<title id="title">营地俯视布局方案 A</title>
<desc id="desc">约40乘34米的城墙营地，南主门宽6米，东西侧门宽4米。五处建筑及城门整备区，中央集结广场，连续沿墙通道和两条绕行路线。蓝色双向箭头为支援通道。仅为建议布局，未进行游戏试玩。</desc>
